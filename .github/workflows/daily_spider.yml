name: Daily Spider

on:
  schedule:
    # Beijing time 09:00 = UTC 01:00
    - cron: "0 23 * * *"
  workflow_dispatch:

jobs:
  scrape-weekly-models:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Verify WeChat template renderer
        run: python -m unittest tests.test_wechat_formatter

      - name: Scrape trending models
        env:
          HF_MODEL_LIMIT: "5"
          HF_WEEKLY_PICK_LIMIT: "6"
          HF_KEEP_DAYS: "0"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: "gemini-3.1-flash-lite-preview"
        run: python main.py

      - name: Commit and push outputs
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          mkdir -p data
          mkdir -p data/daily
          mkdir -p data/week
          mkdir -p assets/huggingface_model_cards

          git add data/daily
          git add data/week
          git add assets/huggingface_model_cards
          git add requirements.txt
          git add *.py
          git add .github/workflows/daily_spider.yml

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update weekly Hugging Face models: $(date +'%Y-%m-%d %H:%M:%S')"
            git push
          fi
